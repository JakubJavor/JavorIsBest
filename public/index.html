<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Cloud v2.1</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/192/3844/3844724.png">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="version-tag">Verze 2.1</div>
            <h1>🎵 Moje Hudba</h1>
            <p class="subtitle">Offline Cloud Player</p>
            <button onclick="location.reload(true)" class="refresh-btn">🔄 Obnovit appku</button>
        </header>
        
        <div class="add-section">
            <h3>Přidat skladbu</h3>
            <input type="text" id="songName" placeholder="Název písničky">
            <input type="text" id="githubUrl" placeholder="GitHub Raw URL">
            <button onclick="addSong()" id="addBtn">Uložit do knihovny</button>
            <div id="status"></div>
        </div>

        <div id="playlist" class="playlist">
            <div class="loader">Načítám...</div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
