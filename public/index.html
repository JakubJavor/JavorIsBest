<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj Offline Přehrávač</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="app-container">
        <h1>🎵 Můj Archiv</h1>
        
        <div class="upload-section">
            <input type="file" id="audioInput" accept="audio/mp3">
            <button onclick="uploadFiles()" id="uploadBtn">Nahrát MP3</button>
            <div id="status"></div>
        </div>

        <div id="playlist" class="playlist">
            <p>Načítám hudbu...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
